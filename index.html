<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>EasyGAS: ทดสอบกล้อง</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #f6f7f8; color: #1c2430; line-height: 1.5; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { margin: 0 0 12px; color: #55606e; font-size: 14px; }
  button, label.btn { display: block; width: 100%; box-sizing: border-box; padding: 14px; margin: 0 0 10px; font-size: 16px; font-weight: 600; border: 0; border-radius: 10px; background: #15803d; color: #fff; text-align: center; }
  button.alt, label.btn { background: #fff; color: #1c2430; border: 1px solid #c9d0d8; }
  button:disabled { background: #c9d0d8; color: #7a8594; }
  video { width: 100%; max-height: 50vh; background: #000; border-radius: 10px; margin-bottom: 10px; display: none; }
  #log { background: #fff; border: 1px solid #dfe3e8; border-radius: 10px; padding: 12px; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .ok { color: #15803d; } .bad { color: #b42318; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<h1>ทดสอบกล้องนอก GAS</h1>
<p>หน้านี้อยู่นอก Google Apps Script และส่งรูปไปที่เว็บแอป GAS ตัวทดสอบ รูปไม่ถูกเก็บไว้ที่ไหน GAS ตอบกลับแค่ขนาดของรูป</p>

<video id="v" playsinline autoplay muted></video>
<button id="open">1. เปิดกล้องสด</button>
<button id="snap" disabled>2. ถ่ายแล้วส่งไป GAS</button>
<label class="btn">3. ถ่ายรูปนิ่งด้วยกล้องของเครื่อง<input id="file" type="file" accept="image/*" capture="environment"></label>
<button id="ping" class="alt">4. เรียก GAS เฉย ๆ (ไม่ใช้กล้อง)</button>

<div id="log"></div>

<script>
var GAS = 'https://script.google.com/macros/s/AKfycbw_Un6yCLyp8fwZ9V6dlRVC7ubhQvuqC8CapJBflGBVJ65MgLfryiPRzvmGutY8pw8Yxg/exec';
var logEl = document.getElementById('log');
var video = document.getElementById('v');
function log(text, cls) {
  var line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = text;
  logEl.appendChild(line);
}
var ua = navigator.userAgent;
var inApp = /Line\//i.test(ua) ? 'LINE' : /FBAN|FBAV/i.test(ua) ? 'Facebook' : /Instagram/i.test(ua) ? 'Instagram' : '';
log('โดเมน: ' + location.origin);
log('เบราว์เซอร์ในแอป: ' + (inApp || 'ไม่ใช่'));
log('รองรับกล้องสด: ' + (navigator.mediaDevices && navigator.mediaDevices.getUserMedia ? 'ใช่' : 'ไม่'));
log(ua);
log('');

function send(dataUrl, label) {
  var started = Date.now();
  log(label + ': กำลังส่ง ' + Math.round(dataUrl.length / 1024) + ' KB ...');
  // No Content-Type header on purpose: a JSON header triggers a preflight that GAS does not answer.
  return fetch(GAS, { method: 'POST', body: JSON.stringify({ action: 'photo', image: dataUrl }) })
    .then(function (r) { return r.json(); })
    .then(function (j) { log('ผ่าน ' + label + ': GAS ได้รับ ' + j.imageChars + ' ตัวอักษร ใช้ ' + (Date.now() - started) + ' ms', 'ok'); })
    .catch(function (e) { log('ไม่ผ่าน ' + label + ': ' + e, 'bad'); });
}
function shrink(source, w, h) {
  var max = 1280, scale = Math.min(1, max / Math.max(w, h));
  var c = document.createElement('canvas');
  c.width = Math.round(w * scale); c.height = Math.round(h * scale);
  c.getContext('2d').drawImage(source, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.8);
}

document.getElementById('open').onclick = function () {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { log('ไม่ผ่าน กล้องสด: เบราว์เซอร์นี้ไม่มี getUserMedia', 'bad'); return; }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
    .then(function (stream) {
      video.srcObject = stream; video.style.display = 'block';
      document.getElementById('snap').disabled = false;
      log('ผ่าน กล้องสด: เปิดได้', 'ok');
    })
    .catch(function (e) { log('ไม่ผ่าน กล้องสด: ' + e.name + ' ' + e.message, 'bad'); });
};
document.getElementById('snap').onclick = function () {
  send(shrink(video, video.videoWidth, video.videoHeight), 'ส่งรูปจากกล้องสด');
};
document.getElementById('file').onchange = function (ev) {
  var f = ev.target.files[0];
  if (!f) { log('ไม่ได้เลือกรูป', 'bad'); return; }
  var img = new Image();
  img.onload = function () { send(shrink(img, img.naturalWidth, img.naturalHeight), 'ส่งรูปนิ่ง'); URL.revokeObjectURL(img.src); };
  img.onerror = function () { log('ไม่ผ่าน รูปนิ่ง: อ่านไฟล์ไม่ได้', 'bad'); };
  img.src = URL.createObjectURL(f);
};
document.getElementById('ping').onclick = function () {
  var started = Date.now();
  fetch(GAS, { method: 'POST', body: JSON.stringify({ action: 'ping' }) })
    .then(function (r) { return r.json(); })
    .then(function (j) { log('ผ่าน เรียก GAS: ' + j.method + ' ใช้ ' + (Date.now() - started) + ' ms', 'ok'); })
    .catch(function (e) { log('ไม่ผ่าน เรียก GAS: ' + e, 'bad'); });
};
</script>
</body>
</html>
