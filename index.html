<body>
<h1>remote google.script.run test</h1>
<pre id="log"></pre>
<script>
var log = document.getElementById('log');
function line(k, v, cls) { var d = document.createElement('div'); d.className = cls; d.textContent = k + ': ' + JSON.stringify(v); log.appendChild(d); }
function run(name, call) {
  return new Promise(function (res) {
    call(function (v, u) { line(name, { ok: true, value: v, user: u }, 'ok'); res(); },
         function (e, u) { line(name, { ok: false, error: e && e.message, name: e && e.name, user: u }, 'bad'); res(); });
  });
}
(async function () {
  line('origin', location.origin, '');
  await run('getItems', function (ok, bad) { google.script.run.withSuccessHandler(ok).withFailureHandler(bad).withUserObject('u1').getItems(); });
  await run('savePhoto 200KB', function (ok, bad) { google.script.run.withSuccessHandler(ok).withFailureHandler(bad).savePhoto('data:image/jpeg;base64,' + 'A'.repeat(200000), 'note'); });
  await run('failing', function (ok, bad) { google.script.run.withSuccessHandler(ok).withFailureHandler(bad).failing(); });
  await run('secret_', function (ok, bad) { google.script.run.withSuccessHandler(ok).withFailureHandler(bad).secret_(); });
  await run('nope', function (ok, bad) { google.script.run.withSuccessHandler(ok).withFailureHandler(bad).nope(); });
  await run('eval', function (ok, bad) { google.script.run.withSuccessHandler(ok).withFailureHandler(bad).eval('1+1'); });
  line('done', true, '');
})();
</script>
